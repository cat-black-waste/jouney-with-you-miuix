<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jouney with you</title>
<style>
  @font-face{font-family:"SG";src:url("fonts/space-grotesk.ttf") format("truetype");font-weight:300 700;font-display:swap}
  @font-face{font-family:"PM";src:url("fonts/plex-mono.ttf") format("truetype");font-weight:400;font-display:swap}
  :root{
    --bg:#FBFBF9;--ink:#0C0C0D;--muted:#8A8A90;--faint:#B6B6BC;
    --accent:#FF5B37;--green:#2FB45A;--line:rgba(12,12,13,.075);
    --ease:cubic-bezier(.16,1,.3,1);
    --text:-apple-system,"SF Pro Text","Noto Sans SC","PingFang SC",system-ui,sans-serif;
    --mono:"PM",ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0B0B0C;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--text);color:var(--ink)}
  .frame{position:relative;width:100vw;height:100dvh;max-width:430px;max-height:920px;
    background:var(--bg);overflow:hidden;isolation:isolate}
  @media (min-width:520px) and (min-height:700px){
    body{background:radial-gradient(120% 90% at 50% 0%,#1D1D20 0%,#08080A 70%)}
    .frame{border-radius:46px;box-shadow:0 60px 140px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.07)}
  }
  .aura{position:absolute;inset:-20% -10% auto -10%;height:72%;pointer-events:none;z-index:0;
    background:radial-gradient(52% 46% at 22% 18%,rgba(255,140,95,.13),transparent 70%),
               radial-gradient(46% 40% at 82% 8%,rgba(150,170,255,.10),transparent 72%);
    filter:blur(10px)}
  .vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(12,12,13,.045) 100%)}

  .topline{position:absolute;left:34px;right:34px;top:calc(26px + env(safe-area-inset-top));
    z-index:4;display:flex;align-items:center;justify-content:space-between}
  .kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
  .brandmini{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.22em;color:var(--faint);text-transform:uppercase}
  .brandmini i{width:4px;height:4px;border-radius:50%;background:var(--accent);display:block}

  .page{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    padding:92px 34px calc(30px + env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;transform:translateY(12px);
    transition:opacity .46s var(--ease),transform .62s var(--ease)}
  .page.on{opacity:1;pointer-events:auto;transform:none}
  .grow{flex:1}
  .copy h1{margin:0;font-size:31px;line-height:1.16;font-weight:600;letter-spacing:-.022em}
  .copy p{margin:9px 0 0;font-size:13.5px;line-height:1.62;color:var(--muted);max-width:19em}

  .cta{appearance:none;border:0;width:100%;height:56px;border-radius:28px;cursor:pointer;
    background:var(--ink);color:#fff;font-family:var(--text);font-size:15.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .22s var(--ease),background .32s var(--ease),color .32s,box-shadow .4s;
    box-shadow:0 14px 34px -16px rgba(12,12,13,.55)}
  .cta:active{transform:scale(.977)}
  .cta.ghost{background:rgba(12,12,13,.055);color:var(--ink);box-shadow:none}
  .cta[disabled]{background:rgba(12,12,13,.055);color:rgba(12,12,13,.3);box-shadow:none;pointer-events:none}
  .cta.done{background:var(--green);box-shadow:0 16px 34px -18px rgba(47,180,90,.75)}

  .ticks{display:flex;gap:6px;margin:0 auto 22px;align-items:center}
  .ticks i{display:block;height:2px;width:26px;border-radius:2px;background:rgba(12,12,13,.13);
    transition:background .45s var(--ease),width .45s var(--ease)}
  .ticks i.on{background:var(--ink);width:40px}

  #markLayer{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
  #mark{position:relative;width:372px;height:192px;transform-origin:50% 50%;
    will-change:transform,opacity;pointer-events:auto;cursor:grab;touch-action:pan-y;
    -webkit-user-select:none;user-select:none}
  #wordmark{display:block;width:372px;height:192px;overflow:visible}
  #construct circle{transform-box:fill-box;transform-origin:50% 100%}
  .pen{pointer-events:none}

  #p1{padding-top:188px}
  .probe{display:flex;flex-direction:column;align-items:center}
  .ring{width:112px;height:112px;position:relative;display:grid;place-items:center}
  .ring svg.ringsvg{position:absolute;inset:0;width:112px;height:112px;transform:rotate(-90deg);
    transition:opacity .4s var(--ease),transform .5s var(--ease)}
  .ring .track{fill:none;stroke:rgba(12,12,13,.065);stroke-width:4}
  .ring .arc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;
    stroke-dasharray:64 240;opacity:0;transition:opacity .3s}
  .ring.running .arc{opacity:1;animation:spin 1.25s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring .done{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
    background:var(--green);color:#fff;transform:scale(.6);opacity:0;
    transition:transform .55s cubic-bezier(.2,1.5,.35,1),opacity .28s}
  .ring.ok .done{transform:scale(1);opacity:1}
  .ring.ok svg.ringsvg{opacity:0;transform:rotate(90deg) scale(.9)}
  .done svg path{stroke-dasharray:34;stroke-dashoffset:34;transition:stroke-dashoffset .38s .16s var(--ease)}
  .ring.ok .done svg path{stroke-dashoffset:0}
  .probe .label{margin-top:24px;font-size:16px;font-weight:600;letter-spacing:-.012em}
  .probe .status{margin-top:7px;font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;
    text-transform:uppercase;color:var(--faint);transition:color .4s}
  .probe .status.ok{color:var(--green)}

  .rows{margin-top:36px;border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:12px;padding:16px 2px;border-bottom:1px solid var(--line)}
  .row .t{flex:1;font-size:14px;font-weight:500}
  .row .s{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
    transition:color .35s}
  .row .spin{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(12,12,13,.12);
    border-top-color:var(--accent);opacity:0;transition:opacity .3s}
  .row.scanning .spin{opacity:1;animation:spin .85s linear infinite}
  .row.ok .s{color:var(--green)}
  .row.ok .spin{display:none}
  .note{margin-top:14px;font-size:11.5px;color:var(--faint);letter-spacing:.01em}

  .signature{text-align:center;padding:0 6px}
  .signature .rule{height:1px;background:var(--line);margin:0 0 18px}
  .signature .by{font-size:13px;color:var(--muted)}
  .signature .meta{margin-top:6px;font-family:var(--mono);font-size:9px;letter-spacing:.26em;
    text-transform:uppercase;color:var(--faint)}

  .scrim{position:absolute;inset:0;z-index:9;background:rgba(10,10,11,.28);
    backdrop-filter:blur(14px) saturate(1.1);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;z-index:10;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
    width:calc(100% - 50px);max-width:340px;transform:translate(-50%,14px) scale(.98);opacity:0;
    pointer-events:none;background:rgba(252,252,250,.92);backdrop-filter:blur(24px);
    border-radius:26px;padding:24px 22px 16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
    transition:.4s var(--ease)}
  .sheet.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
  .sheet h3{margin:0 0 7px;font-size:17px;font-weight:650;letter-spacing:-.015em}
  .sheet p{margin:0 0 16px;font-size:13px;line-height:1.6;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="aura"></div>
  <div class="vignette"></div>

  <div class="topline">
    <div class="kicker" id="kicker">arrival</div>
    <div class="brandmini"><i></i><span id="brandmini">single instance</span></div>
  </div>

  <section class="page on" id="p0">
    <div class="grow"></div>
    <div class="copy">
      <h1 id="greet">hi，早上好</h1>
      <p>先在 o 上落一个圆，线从圆里往两边铺开，剩下的字一个一个画出来——拖着看，笔会跟着你走。</p>
    </div>
    <div style="height:26px"></div>
    <div class="ticks"><i class="on"></i><i></i><i></i></div>
    <button class="cta" id="next0">继续
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </section>

  <section class="page" id="p1">
    <div class="probe">
      <div class="ring" id="ring">
        <svg class="ringsvg" viewBox="0 0 112 112">
          <circle class="track" cx="56" cy="56" r="50"/>
          <circle class="arc" cx="56" cy="56" r="50"/>
        </svg>
        <div class="done">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
      </div>
      <div class="label" id="probeLabel">正在检测权限</div>
      <div class="status" id="probeStatus">checking · 0/3</div>
    </div>
    <div class="rows" id="rows">
      <div class="row"><div class="t">存储目录</div><div class="s">waiting</div><div class="spin"></div></div>
      <div class="row"><div class="t">通知回执</div><div class="s">waiting</div><div class="spin"></div></div>
      <div class="row"><div class="t">位置状态</div><div class="s">waiting</div><div class="spin"></div></div>
    </div>
    <div class="note">假检测：不申请也不需要任何真实权限。</div>
    <div class="grow"></div>
    <div class="ticks"><i></i><i class="on"></i><i></i></div>
    <button class="cta" id="next1" disabled>下一步进入</button>
  </section>

  <section class="page" id="p2">
    <div class="grow"></div>
    <div class="signature">
      <div class="rule"></div>
      <div class="by">jouney with you</div>
      <div class="meta">design · motion · kotlin</div>
    </div>
    <div class="grow"></div>
    <div class="ticks"><i></i><i></i><i class="on"></i></div>
    <button class="cta" id="start">开始使用</button>
  </section>

  <div id="markLayer">
    <div id="mark" aria-label="jouney with you">
      <svg id="wordmark" viewBox="0 0 372 192"></svg>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <h3>这是演示版本</h3>
    <p>“开始使用”是一个假按钮：点下去只弹这个面板，没有真实业务流程。</p>
    <button class="cta ghost" id="sheetOk">知道了</button>
  </div>
</div>

    state.cur.s += (slot.s - state.cur.s) * k;
    state.cur.o += (slot.o - state.cur.o) * k;
    const off = state.cur.y * frame.clientHeight - frame.clientHeight/2;
    mark.style.transform = `translateY(${off.toFixed(2)}px) scale(${(baseScale()*state.cur.s).toFixed(4)})`;
    mark.style.opacity = state.cur.o.toFixed(3);

    const t = (state.page === 0) ? now - state.t0 : 1e9;
    const scrubbing = state.page === 0 && state.active && state.px !== null;

    // construction: circle draws, then squashes into the baseline
    const cirP = scrubbing ? 1 : easeOut(t / 300);
    const morph = scrubbing ? 1 : clamp((t - 300) / 560);
    circle.setAttribute('stroke-dashoffset', String(1 - cirP));
    const oP = letters[1] ? letters[1].p : 0;
    circle.style.opacity = String(clamp(cirP) * (1 - smooth(oP)));
    railL.setAttribute('stroke-dashoffset', String(1 - easeOut(morph)));
    railR.setAttribute('stroke-dashoffset', String(1 - easeOut(morph)));

    // letters: progress is split across contour pieces by length
    letters.forEach((L, i) => {
      let p;
      if (scrubbing){
        p = smooth(clamp((state.px - (L.g.x - 16)) / (L.g.w + 34)));
      } else if (state.page !== 0 || state.autoDone){
        p = 1;
      } else {
        p = clamp((t - L.start) / L.dur);
      }
      L.p = p;
      L.grp.style.visibility = p > 0.002 ? 'visible' : 'hidden';
      let acc = 0;
      L.parts.forEach(pt => {
        const local = clamp((p * L.totalLen - acc) / pt.len);
        acc += pt.len;
        pt.local = local;
        pt.el.setAttribute('stroke-dashoffset', String(1 - local));
        pt.el.setAttribute('stroke', rgb(lerpC(GRAY, INK, smooth(p))));
      });
      const dry = smooth((p - .9) / .1);
      L.fill.setAttribute('fill-opacity', String(dry));
      L.fill.setAttribute('fill', rgb(lerpC(lerpC(GRAY, INK, p), INK, dry)));
      L.guide.setAttribute('fill-opacity', String(0.05 * (1 - smooth(p))));
      ticks.children[i].style.opacity = p > 0.02 ? String(1 - smooth(p)) : '0';
    });

    // pen: rides the contour currently being written
    let active = null, activePart = null;
    for (const L of letters){
      if (L.p <= 0.002 || L.p >= 0.999) continue;
      for (const pt of L.parts){
        if (pt.local > 0.002 && pt.local < 0.999) { active = L; activePart = pt; }
      }
    }
    if (active && activePart && (scrubbing || !state.autoDone)){
      const s = active.g.s;
      const put = (el, frac) => {
        const pos = activePart.el.getPointAtLength(clamp(frac) * activePart.len);
        el.setAttribute('cx', String(active.g.x + s*pos.x));
        el.setAttribute('cy', String(active.g.y - s*pos.y));
      };
      put(pen._dot, activePart.local);
      pen._ghosts.forEach((g, gi) => put(g, activePart.local - (gi+1)*0.06));
      pen.setAttribute('opacity','1');
    } else {
      pen.setAttribute('opacity','0');
    }

    state.vx *= Math.exp(-dt * 9);
    requestAnimationFrame(frameLoop);
  }

  const h = new Date().getHours();
  document.getElementById('greet').innerHTML =
    `hi，${h<5?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':h<23?'晚上好':'夜深了'}`;

  setPage(0);
  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
